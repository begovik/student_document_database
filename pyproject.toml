[project]
name = "harvester"
version = "0.1.0"
description = "Continuous PDF scientific sources collector"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "ddgs>=8.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
    "PyMuPDF>=1.24.0",
    "pypdf>=4.2.0",
    "lingua-language-detector>=2.0.0",
    "langdetect>=1.0.9",
    "rapidfuzz>=3.8.0",
    "selectolax>=0.3.21",
    "lxml>=5.2.0",
    "protego>=0.3.1",
    "tldextract>=5.1.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
harvester = "harvester.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harvester*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
