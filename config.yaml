# ГОЛОВНА ЦІЛЬ: збирати якісні джерела з повним текстом — інформативні статті/монографії/посібники,
# придатні для наукових праць (титул, вступ/мета, розділи, висновки, список джерел). Не тези/зміст/анотації.
contact:
  email: "you@example.org"

database:
  mode: "auto"
  host: ""
  port: 5432
  name: "harvester"
  user: "harvester"
  connect_timeout_s: 5
  retries: 3
  retry_delay_s: 2
  restore_probe_interval_s: 30
  local_db_path: "data/harvester.db"

paths:
  db_path: "data/harvester.db"
  tmp_dir: "data/tmp"
  # backup_dir: "backups"

workers:
  verify: 6
  discovery: 3
  scanner: 0  # окремого scanner-воркера ще немає
  classify: 1

http:
  global_concurrency: 32
  per_host_delay_ms: 2000
  per_host_burst: 2
  max_pdf_bytes: 209715200
  min_pdf_bytes: 10240
  max_redirects: 5
  connect_timeout_s: 10
  read_timeout_s: 30
  total_timeout_s: 300
  bandwidth_mbps: 2.0
  user_agent: "Harvester/1.0 (+contact: you@example.org)"

channels:
  ddgs:
    enabled: true
    backends:
      - duckduckgo
      - bing
      - brave
      - mojeek
      - startpage
      - yahoo
      - wikipedia
    query_interval_s: [3, 10]
  openalex:
    enabled: true
    # Ліміт OpenAlex — 10 запитів/с на акаунт (за mailto). Значення нижче
    # застосовується ОСОБИСТО до кожного екземпляра каналу, а екземпляр
    # свій у кожного discovery-воркера: при rps: 5 і 3 воркерах сумарно
    # виходило 15 зап/с, тобто гарантований 429.
    # 3 × 3 = 9 зап/с — нижче ліміту навіть за максимального навантаження.
    rps: 3
  # Адаптер реалізовано (harvester/discovery/crossref.py).
  # Ліміт Crossref — 50 зап/с у polite-пулі, без денного бюджету на IP,
  # на відміну від OpenAlex. 5 консервативно: 3 воркери × 5 = 15 зап/с.
  crossref:
    enabled: true
    rps: 5
  unpaywall:
    enabled: false  # адаптер ще не реалізований
    rps: 1
  semanticscholar:
    enabled: false  # адаптер ще не реалізований
    rps: 1
  arxiv:
    enabled: false  # адаптер ще не реалізований
    rps: 0.33
  doaj:
    enabled: false  # адаптер ще не реалізований
    rps: 1
  internet_archive:
    enabled: false  # адаптер ще не реалізований
    rps: 1
  core:
    enabled: false
  oai:
    enabled: false  # OAI-сканер ще не реалізований
    per_host_interval_s: 2

filters:
  blocked_tlds:
    - ".ru"
    - ".su"
    - ".рф"
    - ".xn--p1ai"
  soviet_cutoff_year: 1991
  soviet_action: reject
  ru_lang_min_confidence: 0.8

verify:
  first_pages_for_text: 3
  title_match_min: 85
  title_match_review: 60
  max_pages: 2000
  max_attempts: 3

classify:
  min_score: 0.25
  max_topics: 3

reverify:
  interval_days_new: 30
  interval_days_stable: 90
  broken_retry_days: 3

# Цілодобовий аудитор якості (strict-профіль, окремий воркер).
#
# focus_first_seen_after — відсічка для прицільної кампанії. Verifier
# бере найстаріші недоперевірені документи, тож відсічка зупиняє обробку
# беклогу. null → нейтральна відсічка 1970-01-01, звичайна поведінка.
#
# Було увімкнено 02.10.2026 на час кампанії «договір за участі
# неповнолітньої особи», вимкнено того ж дня: селектор і так ставить
# документи без вердикта першими (ORDER BY vr.checked_at IS NULL DESC),
# тож starvation нові документи не загрожував, а натомість блокував
# 18 уже зібраних тематичних правових робіт, які чекали повторної
# перевірки з виправленим вердиктором.
verifier:
  focus_first_seen_after: null

scanner:
  max_pages_per_source: 300
  max_depth: 2
  sitemap_max_urls: 50000

retention:
  fetch_attempts_days: 90
  events_days: 180
  # backups_keep: 14

logging:
  level: INFO
  file: "logs/harvester.log"

# Порядок LLM-моделей. Ланцюг перебирає зверху вниз і бере першу, що
# відповіла. gemma-4-26b-a4b-it — першою: за вимірами 26.09.2026 її
# успішність 99.7% проти 74.9% у gemma-4-31b-it (деградація моделі на
# боці Google). Поміняти місцями — і наступний рестарт підхопить.
llm:
  gemma_models:
    - gemma-4-26b-a4b-it
    - gemma-4-31b-it
